name: Build and attach Coloratio to release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Inject release version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}" -replace '^[vV]', ''
          $path = "service/main_window.py"
          (Get-Content $path -Raw) `
            -replace 'APP_VERSION\s*=\s*"[^"]*"', "APP_VERSION = `"$tag`"" `
            | Set-Content $path -Encoding utf8
          Get-Content $path | Select-String 'APP_VERSION'

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm build.spec

      - name: Rename exe
        run: Move-Item dist/Coloratio.exe Coloratio-${{ github.event.release.tag_name }}-win64.exe

      - name: Upload asset to release
        uses: softprops/action-gh-release@v2
        with:
          files: Coloratio-${{ github.event.release.tag_name }}-win64.exe
