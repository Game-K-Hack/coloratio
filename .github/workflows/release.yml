name: Build & Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build EXE
        run: pyinstaller --noconfirm build.spec

      - name: Rename EXE with version
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}"
          $src = "dist/Coloratio.exe"
          $dst = "dist/Coloratio-$version-win64.exe"
          Rename-Item $src $dst
          echo "ASSET_PATH=$dst" >> $env:GITHUB_ENV
          echo "ASSET_NAME=Coloratio-$version-win64.exe" >> $env:GITHUB_ENV

      - name: Upload artifact (CI archive)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_PATH }}

      - name: Attach EXE to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
